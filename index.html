<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Бюджет</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--text:#14181f;--muted:#6b7280;--line:#e5e7eb;
  --accent:#0f766e;--accent-text:#ffffff;--accent-soft:#e6f4f2;
  --ok:#16a34a;--ok-soft:#dcfce7;--warn:#c2410c;--warn-soft:#ffedd5;--bad:#dc2626;--bad-soft:#fee2e2;
  --track:#eceef1;--shadow:0 1px 2px rgba(0,0,0,.05);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1117;--card:#161b22;--text:#e6edf3;--muted:#8b949e;--line:#2a3038;
  --accent:#2dd4bf;--accent-text:#04201c;--accent-soft:#0f2e2b;
  --ok:#3fb950;--ok-soft:#12301b;--warn:#f0883e;--warn-soft:#3a2312;--bad:#f85149;--bad-soft:#3d1517;
  --track:#232a33;--shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding:calc(env(safe-area-inset-top) + 56px) 16px calc(env(safe-area-inset-bottom) + 84px);
  min-height:100vh;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 0}
label>input,label>select,label>textarea{margin-top:4px;color:var(--text)}
h2{font-size:20px;margin:0 0 8px}
h3{font-size:15px;margin:20px 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.muted{color:var(--muted)}
.neg{color:var(--bad)}
.pos{color:var(--ok)}
main{max-width:640px;margin:0 auto}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--bg);
  padding:env(safe-area-inset-top) 8px 0;display:flex;align-items:center;justify-content:center;height:calc(env(safe-area-inset-top) + 52px);
  border-bottom:1px solid var(--line)}
.top .mtitle{font-weight:650;font-size:17px;min-width:170px;text-align:center}
.icon{width:44px;height:44px;border-radius:12px;font-size:26px;line-height:1;color:var(--accent)}
.icon:active{background:var(--accent-soft)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}

/* cards */
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
.hero{padding:18px 16px}
.hero .lbl{font-size:13px;color:var(--muted)}
.hero .big{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 12px}
.grid .card{margin:0;display:block;text-align:left;width:100%}
.stat .lbl{font-size:12px;color:var(--muted)}
.stat .val{font-size:18px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:11px;color:var(--muted);margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}.bar i.muted{background:var(--muted)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.cat{display:block;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 8px;box-shadow:var(--shadow)}
.cat:active,.tx:active{opacity:.7}
.cat .row1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.cat .cname{font-weight:600}
.cat .row2{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.muted{background:var(--track);color:var(--muted)}

.alert{display:block;width:100%;text-align:left;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;margin:0 0 12px;font-weight:550}
.banner{background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin:0 0 12px;font-size:14px}
.banner .row{margin-top:8px;justify-content:flex-start}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-text);
  border-radius:12px;padding:12px 16px;font-weight:600;min-height:44px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.small{padding:8px 12px;min-height:36px;font-size:14px}
.btn.wide{width:100%;margin:0 0 10px}
.btn:active{opacity:.75}
.btns{display:flex;gap:10px;margin-top:16px}.btns .btn{flex:1}

/* plan */
.pc-head{display:flex;gap:8px;align-items:center}
.pc-name{font-weight:650;border-color:transparent;background:transparent;padding:6px 8px;margin-left:-8px}
.pc-total{font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.srow{display:flex;gap:8px;align-items:center;margin-top:8px}
.srow .amt{width:96px;flex:none;text-align:right}
.srow .lbl{flex:1;color:var(--muted)}
.x{width:36px;height:36px;flex:none;border-radius:10px;color:var(--muted);font-size:16px}
.x:active{background:var(--bad-soft);color:var(--bad)}
.pc-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pc-actions button{font-size:13px;padding:7px 10px;border-radius:9px;background:var(--bg);color:var(--muted)}
.pc-actions .add{color:var(--accent)}
.pc-actions .del{margin-left:auto;color:var(--bad)}
.plansum{position:sticky;top:calc(env(safe-area-inset-top) + 60px);z-index:2;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:10px 14px;margin:0 0 12px;display:flex;justify-content:space-between;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}
.plansum b{display:block;font-size:16px}

/* transactions */
.tools{display:flex;gap:10px;margin:0 0 12px}.tools .btn{flex:1}
.dhead{font-size:12px;color:var(--muted);margin:14px 4px 6px;font-weight:600}
.tx{display:flex;width:100%;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:var(--card);
  padding:11px 14px;border-bottom:1px solid var(--line)}
.txlist{border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.txlist .tx:last-child{border-bottom:0}
.tx b{font-weight:550;display:block}
.tx small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.tx .amt{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.tx .flag{color:var(--warn)}
.ungroup{display:flex;gap:8px;align-items:center;margin-top:10px}
.ungroup .nm{flex:1;min-width:0}
.ungroup select{width:48%;flex:none}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);-webkit-overflow-scrolling:touch}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-top:4px}
.seg label{flex:1;margin:0;text-align:center}
.seg input{display:none}
.seg span{display:block;padding:8px;border-radius:8px;color:var(--muted);font-size:15px}
.seg input:checked+span{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.check{display:flex;gap:10px;align-items:center;color:var(--text);font-size:14px}
.check input{width:20px;height:20px;flex:none}
.preview{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}
.preview table{border-collapse:collapse;font-size:12px;min-width:100%}
.preview td,.preview th{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
.preview th{color:var(--muted);font-weight:600}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
details{margin-top:12px}summary{color:var(--accent);font-weight:600;padding:6px 0}
.empty{text-align:center;padding:36px 8px}
.empty .logo{width:72px;height:72px;border-radius:18px;margin:0 auto 12px;display:block}
.empty p{color:var(--muted)}
ol.steps{padding-left:20px;margin:6px 0 0}ol.steps li{margin:4px 0}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;
  transition:.25s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="view"></main>
<nav class="tabs">
  <button data-act="tab" data-tab="overview"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Обзор</button>
  <button data-act="tab" data-tab="plan"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>План</button>
  <button data-act="tab" data-tab="tx"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>Операции</button>
  <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Ещё</button>
</nav>
<div id="sheet" class="sheet-wrap" hidden><div class="sheet"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="toast" role="status"></div>
<input type="file" id="fileCsv" accept=".csv,.tsv,.txt,text/csv,text/plain,text/comma-separated-values" hidden>
<input type="file" id="fileBackup" accept=".json,application/json" hidden>

<script>
'use strict';
const KEY = 'budget-app-v1';
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const STARTER = [
  ['Продукты'], ['Дом', ['Коммуналка','Интернет','Связь']], ['Транспорт', ['Заправка','Такси','Общественный']],
  ['Покупки'], ['Развлечения', ['Кафе и рестораны','Кино']], ['Здоровье'], ['Подписки'],
  ['Уход за собой'], ['Подарки'], ['Путешествия'], ['Накопления']
];

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').trim().toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ');
const nf = new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 2});
const money = n => nf.format(Math.round((n || 0) * 100) / 100) + (S.currency ? ' ' + S.currency : '');
const num = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

// ---------- storage ----------
function blank() { return {version: 1, currency: 'Br', months: {}, aliases: {}, lastBackup: null, hideInstall: false}; }
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.months) return Object.assign(blank(), d); } catch (e) {}
  return blank();
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Не удалось сохранить: ' + e.message); }
}
let saveTimer;
const saveSoon = () => { clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); };
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// ---------- ui state ----------
let cur = today().slice(0, 7);
let tab = 'overview';
let txFilter = 'all';
let imp = null;

// ---------- months ----------
function monthLabel(k) { const [y, m] = k.split('-'); return MONTHS[+m - 1] + ' ' + y; }
function shiftMonth(k, d) {
  let [y, m] = k.split('-').map(Number); m += d;
  while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
  return y + '-' + pad(m);
}
function sourceMonth(k) {
  const keys = Object.keys(S.months).sort();
  return keys.filter(x => x < k).pop() || keys.find(x => x > k) || null;
}
function ensureMonth(k) {
  if (!S.months[k]) {
    const src = sourceMonth(k), m = src ? S.months[src] : null;
    S.months[k] = {income: m ? m.income : null, cats: m ? JSON.parse(JSON.stringify(m.cats)) : [], tx: []};
  }
  return S.months[k];
}

// ---------- calculations ----------
function findCat(m, name) {
  const n = norm(name); if (!n) return null;
  const c = m.cats.find(c => norm(c.name) === n); if (c) return c;
  const a = S.aliases[n];
  return a ? m.cats.find(c => norm(c.name) === norm(a)) || null : null;
}
function catLimit(c) { return c.subs && c.subs.length ? c.subs.reduce((s, x) => s + num(x.limit), 0) : num(c.limit); }
function calc(m) {
  const per = new Map(m.cats.map(c => [c.id, 0]));
  let incomeTx = 0; const un = [];
  for (const t of m.tx) {
    const c = findCat(m, t.cat);
    if (c) per.set(c.id, per.get(c.id) - t.amount);
    else if (t.amount > 0) incomeTx += t.amount;
    else un.push(t);
  }
  const plan = m.cats.reduce((s, c) => s + catLimit(c), 0);
  const unSum = un.reduce((s, t) => s - t.amount, 0);
  const spent = [...per.values()].reduce((a, b) => a + b, 0) + unSum;
  const auto = m.income == null || m.income === '';
  const income = auto ? incomeTx : num(m.income);
  return {per, incomeTx, un, unSum, plan, spent, income, auto, free: income - plan, left: income - spent};
}
function status(limit, spent) {
  if (limit <= 0) return spent > 0.005 ? ['Вне плана', 'warn'] : ['Нет лимита', 'muted'];
  if (spent > limit + 0.005) return ['Превышен', 'bad'];
  if (Math.abs(limit - spent) < 0.005) return ['Исчерпан', 'warn'];
  if (spent / limit >= 0.85) return ['Почти всё', 'warn'];
  return ['В норме', 'ok'];
}
function needBackup() {
  const hasTx = Object.values(S.months).some(m => m.tx.length);
  return hasTx && (!S.lastBackup || Date.now() - S.lastBackup > 14 * 864e5);
}
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

// ---------- views ----------
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const empty = !Object.keys(S.months).length;
  $('#top').innerHTML = tab === 'settings' || empty
    ? `<div class="mtitle">${tab === 'settings' ? 'Ещё' : 'Бюджет'}</div>`
    : `<button class="icon" data-act="prev" aria-label="Предыдущий месяц">‹</button><div class="mtitle">${monthLabel(cur)}</div><button class="icon" data-act="next" aria-label="Следующий месяц">›</button>`;
  $('#view').innerHTML = tab === 'settings' ? vSettings() : empty ? vWelcome() : ({overview: vOverview, plan: vPlan, tx: vTx})[tab]();
}

function vWelcome() {
  return `<div class="empty">
    <img class="logo" src="icon-192.png" alt="">
    <h2>Планирование бюджета</h2>
    <p>Данные хранятся только на этом устройстве.</p>
  </div>
  <button class="btn wide" data-act="restore">Восстановить из резервной копии</button>
  <button class="btn ghost wide" data-act="starter">Начать с типовых категорий</button>
  <button class="btn ghost wide" data-act="blankStart">Начать с нуля</button>
  ${installBanner()}`;
}

function noMonth() {
  const src = sourceMonth(cur);
  return `<div class="empty"><p>Плана на ${monthLabel(cur).toLowerCase()} пока нет.</p>
    <button class="btn" data-act="createMonth">${src ? 'Создать — копия плана за ' + monthLabel(src).toLowerCase() : 'Создать план'}</button></div>`;
}

function installBanner() {
  if (!isIOS || standalone || S.hideInstall) return '';
  return `<div class="banner"><b>Установите на экран «Домой»</b><br>
    В Safari нажмите «Поделиться» → «На экран „Домой“» и пользуйтесь только с иконки:
    у приложения с иконки и у вкладки Safari разные данные.
    <div class="row"><button class="btn small ghost" data-act="hideInstall">Понятно</button></div></div>`;
}

function vOverview() {
  const m = S.months[cur]; if (!m) return noMonth();
  const r = calc(m);
  const pct = r.plan > 0 ? r.spent / r.plan : 0;
  const [, cls] = status(r.plan, r.spent);
  let h = installBanner();
  if (needBackup()) h += `<div class="banner">${S.lastBackup ? 'Резервная копия не делалась больше двух недель.' : 'Резервной копии ещё нет.'}
    Если удалить иконку приложения, данные пропадут.
    <div class="row"><button class="btn small" data-act="backup">Сделать копию</button></div></div>`;
  h += `<section class="card hero">
    <div class="lbl">Текущий остаток (доход − потрачено)</div>
    <div class="big ${r.left < 0 ? 'neg' : ''}">${money(r.left)}</div>
    <div class="bar"><i class="${cls}" style="width:${Math.min(100, pct * 100)}%"></i></div>
    <div class="row small" style="margin-top:6px"><span>Потрачено ${money(r.spent)}</span><span>${Math.round(pct * 100)}% плана</span></div>
  </section>
  <div class="grid">
    <button class="card stat" data-act="editIncome"><div class="lbl">Доход</div><div class="val">${money(r.income)}</div><div class="sub">${r.auto ? 'из операций · изменить' : 'задан вручную · изменить'}</div></button>
    <div class="card stat"><div class="lbl">План расходов</div><div class="val">${money(r.plan)}</div><div class="sub">${m.cats.length} категорий</div></div>
    <div class="card stat"><div class="lbl">Свободные деньги</div><div class="val ${r.free < 0 ? 'neg' : ''}">${money(r.free)}</div><div class="sub">доход − план</div></div>
    <div class="card stat"><div class="lbl">Осталось по плану</div><div class="val ${r.plan - r.spent < 0 ? 'neg' : ''}">${money(r.plan - r.spent)}</div><div class="sub">план − потрачено</div></div>
  </div>`;
  if (r.un.length) h += `<button class="alert" data-act="showUn">⚠ Вне категорий плана: ${r.un.length} ${plural(r.un.length, 'операция', 'операции', 'операций')} на ${money(r.unSum)} — разобрать</button>`;

function subBreakdown(c, list) {

// ---------- CSV import ----------
// column detection by header name; Qalta: id, amount, note, date, category name, subcategory name, transfer account, transfer account kind
const DETECT = {
  id: /^id$/i, cat: /categ|катег/i, sub: /subcat|подкат/i, amount: /amount|sum|сумм/i, date: /date|дата|time|время/i,
  note: /note|comment|memo|descr|замет|коммент|описан|примеч/i, type: /^type$|^тип/i,
  transfer: /^transfer account$|^перевод|счет зачисл/i, tkind: /^transfer account kind$/i
};
const FIELDS = [['cat', 'Категория'], ['sub', 'Подкатегория'], ['amount', 'Сумма'], ['date', 'Дата'], ['note', 'Заметка'], ['transfer', 'Перевод на счёт']];

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  let delim = ',', best = 0;
  for (const d of [',', ';', '\t']) { const n = first.split(d).length; if (n > best) { best = n; delim = d; } }
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
function parseAmount(s) {
  s = String(s ?? '').replace(/[\s  ]/g, '').replace(/[−–—]/g, '-');
  if (!/\d/.test(s)) return null;
  const neg = /^\(.*\)$/.test(s) || /-/.test(s.replace(/\d.*$/, '')) || /-$/.test(s);
  s = s.replace(/[^\d.,]/g, '');
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc >= 0 && ld >= 0) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (lc >= 0) s = /^\d+,\d{1,2}$/.test(s) ? s.replace(',', '.') : s.replace(/,/g, '');
  const n = parseFloat(s);
  return isFinite(n) ? (neg ? -n : n) : null;
}
function parseDate(s) {
  s = String(s ?? '').trim(); let m;
  // ISO timestamp in UTC (Qalta): take the local date, otherwise late-night operations shift a day
  if (/^\d{4}-\d{2}-\d{2}T[\d:.]+(Z|[+-]\d{2}:?\d{2})$/.test(s)) {
    const d = new Date(s);
    if (!isNaN(d)) return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  const ok = (y, mo, d) => { mo = +mo; d = +d; if (mo > 12 && d <= 12) [mo, d] = [d, mo]; return mo >= 1 && mo <= 12 && d >= 1 && d <= 31 ? y + '-' + pad(mo) + '-' + pad(d) : null; };
  if ((m = s.match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/))) return ok(m[1], m[2], m[3]);
  if ((m = s.match(/(\d{1,2})[-.\/](\d{1,2})[-.\/](\d{2,4})/))) return ok(m[3].length === 2 ? '20' + m[3] : m[3], m[2], m[1]);
  return null;
}
async function readText(file) {
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', {fatal: true}).decode(buf); }
  catch (e) { return new TextDecoder('windows-1251').decode(buf); }
}

function startImport(text) {
  const rows = parseCSV(text);
  if (!rows.length) { toast('В файле не нашлось строк'); return; }
  const head = rows[0];
  const hasHeader = head.some(h => Object.values(DETECT).some(re => re.test(h))) || head.every(h => parseAmount(h) == null);
  const map = {};
  for (const k in DETECT) map[k] = -1;
  if (hasHeader) {
    for (const k in DETECT) {
      let i = head.findIndex(h => DETECT[k].test(h) && !/sub|подкат/i.test(h) && !Object.values(map).includes(head.indexOf(h)));
      if (i < 0) i = head.findIndex(h => DETECT[k].test(h) && !Object.values(map).includes(head.indexOf(h)));
      map[k] = i;
    }
  }
  if (map.amount < 0) map.amount = head.findIndex((_, i) => rows.slice(hasHeader ? 1 : 0, 20).filter(r => parseAmount(r[i]) != null).length > 0 && i !== map.cat && i !== map.date);
  if (map.cat < 0) map.cat = head.findIndex((_, i) => i !== map.amount && i !== map.date);
  imp = {rows, hasHeader, map, mode: 'replace', invert: false, skipTransfers: true, target: cur};
  renderImport();
}
function buildItems() {
  const {rows, hasHeader, map} = imp;
  const items = []; let skipped = 0;
  for (const r of hasHeader ? rows.slice(1) : rows) {
    let a = map.amount >= 0 ? parseAmount(r[map.amount]) : null;
    if (a == null || a === 0) { skipped++; continue; }
    if (map.type >= 0) {
      const t = norm(r[map.type]);
      if (/перевод|transfer/.test(t)) { if (imp.skipTransfers) { skipped++; continue; } }
      else if (/расход|expense|списан|debit|outcome|трат/.test(t)) a = -Math.abs(a);
      else if (/доход|income|зачисл|credit|поступ/.test(t)) a = Math.abs(a);
    }
    if (imp.invert) a = -a;
    const col = k => map[k] >= 0 ? String(r[map[k]] ?? '').trim() : '';
    let cat = col('cat');
    const tr = col('transfer');
    if (tr) {
      // between own regular accounts it's not spending; to a debt/savings account it shows up as "Перевод → счёт"
      const kind = norm(col('tkind'));
      if (imp.skipTransfers && (!kind || kind === 'regular')) { skipped++; continue; }
      if (!cat) cat = 'Перевод → ' + tr;
    }
    items.push({
      date: map.date >= 0 ? parseDate(r[map.date]) : null,
      cat, sub: col('sub'),
      amount: Math.round(a * 100) / 100,
      note: col('note'),
      extId: col('id')
    });
  }
  return {items, skipped};
}
function renderImport() {
  const {rows, hasHeader, map} = imp;
  const head = rows[0];
  const colOpts = sel => `<option value="-1">—</option>` + head.map((h, i) => `<option value="${i}" ${sel === i ? 'selected' : ''}>${esc(hasHeader ? h || 'Колонка ' + (i + 1) : 'Колонка ' + (i + 1))}</option>`).join('');
  openSheet(`<h2>Импорт операций</h2>
    <p class="hint">Проверьте, что колонки определились правильно.</p>
    <div class="maps">${FIELDS.map(([k, l]) => `<label>${l}<select data-imp="${k}">${colOpts(map[k])}</select></label>`).join('')}</div>
    <div class="preview" id="impPreview"></div>
    <label class="check" style="margin-top:14px"><input type="checkbox" data-impflag="invert" ${imp.invert ? 'checked' : ''}> Расходы в файле со знаком «+» (поменять знак)</label>
    ${map.type >= 0 || map.transfer >= 0 ? `<label class="check" style="margin-top:10px"><input type="checkbox" data-impflag="skipTransfers" ${imp.skipTransfers ? 'checked' : ''}> Пропускать переводы между своими обычными счетами</label>
      <p class="hint">Переводы на долговые и накопительные счета загружаются как «Перевод → счёт», их можно отнести к категории плана.</p>` : ''}
    <div id="impSummary"></div>
    <label>Если операция уже есть в месяце</label>
    <div class="seg"><label><input type="radio" name="impmode" value="replace" ${imp.mode === 'replace' ? 'checked' : ''}><span>Заменить импорт</span></label>
      <label><input type="radio" name="impmode" value="add" ${imp.mode === 'add' ? 'checked' : ''}><span>Добавить новые</span></label></div>
    <p class="hint">«Заменить» — удалит ранее импортированные операции этих месяцев и загрузит файл заново (ручные операции останутся). «Добавить» — пропустит совпадающие операции.</p>
    <div class="btns"><button class="btn ghost" data-act="close">Отмена</button><button class="btn" data-act="doImport">Импортировать</button></div>`);
  renderImpSummary();
}
function renderImpSummary() {
  const {items, skipped} = buildItems();
  const months = new Map(), unknown = new Set();
  for (const it of items) {
    const k = it.date ? it.date.slice(0, 7) : null; months.set(k, (months.get(k) || 0) + 1);
    const m = S.months[k || imp.target] || S.months[sourceMonth(k || imp.target)] ;
    if (it.amount < 0 && (!m || !findCat(m, it.cat))) unknown.add(it.cat || 'без категории');
  }
  $('#impPreview').innerHTML = `<table><tr><th>Дата</th><th>Категория</th><th>Подкатегория</th><th>Сумма</th></tr>${items.slice(0, 5).map(i =>
    `<tr><td>${i.date ? i.date.slice(8) + '.' + i.date.slice(5, 7) : '—'}</td><td>${esc(i.cat)}</td><td>${esc(i.sub)}</td><td>${nf.format(i.amount)}</td></tr>`).join('')}</table>`;
  const exp = items.filter(i => i.amount < 0).reduce((s, i) => s - i.amount, 0);
  const inc = items.filter(i => i.amount > 0).reduce((s, i) => s + i.amount, 0);
  $('#impSummary').innerHTML = `<div class="card" style="background:var(--bg);margin-top:14px">
    <b>${items.length} ${plural(items.length, 'операция', 'операции', 'операций')}</b>${skipped ? ` <span class="small">· пропущено ${skipped}</span>` : ''}
    <div class="small">Расходы ${money(exp)} · Поступления ${money(inc)}</div>
    <div class="small" style="margin-top:4px">${[...months].map(([k, n]) => (k ? monthLabel(k) : 'Без даты') + ': ' + n).join(' · ')}</div>
    ${months.has(null) ? `<label>Операции без даты отнести к месяцу<input type="month" data-imptarget value="${imp.target}"></label>` : ''}
    ${unknown.size ? `<p class="hint" style="color:var(--warn)">Нет в плане: ${[...unknown].map(esc).join(', ')}. После импорта их можно будет разобрать.</p>` : ''}
  </div>`;
}
function doImport() {
  const {items} = buildItems();
  if (!items.length) { toast('Нечего импортировать'); return; }
  const groups = new Map();
  for (const it of items) { const k = it.date ? it.date.slice(0, 7) : imp.target; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); }
  let added = 0, dup = 0;
  const key = t => t.extId ? 'id:' + t.extId : [t.date || '', norm(t.cat), norm(t.sub), t.amount, norm(t.note)].join('|');
  for (const [k, list] of groups) {
    const m = ensureMonth(k);
    if (imp.mode === 'replace') m.tx = m.tx.filter(t => t.src !== 'import');
    const seen = new Set(m.tx.map(key));
    for (const it of list) {
      if (imp.mode === 'add' && seen.has(key(it))) { dup++; continue; }
      m.tx.push(Object.assign({id: uid(), src: 'import'}, it)); added++;
    }
  }
  save();
  const ks = [...groups.keys()].sort();
  cur = ks[ks.length - 1];
  closeSheet(); tab = 'overview'; render();
  toast(`Загружено ${added}${dup ? `, пропущено дублей ${dup}` : ''}`);
}

// ---------- backup ----------
async function doBackup() {
  const name = 'budget-backup-' + today() + '.json';
  const data = JSON.stringify({app: 'budget-pwa', version: 1, exportedAt: new Date().toISOString(), data: S});
  const file = new File([data], name, {type: 'application/json'});
  const done = () => { S.lastBackup = Date.now(); save(); render(); toast('Копия сохранена'); };
  try {
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: 'Резервная копия бюджета'}); done(); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  done();
}
async function restoreFrom(file) {
  try {
    const obj = JSON.parse(await readText(file));
    const d = obj && obj.data ? obj.data : obj;
    if (!d || typeof d.months !== 'object') throw new Error('это не файл резервной копии');
    const n = Object.keys(d.months).length;
    if (Object.keys(S.months).length && !confirm(`Заменить текущие данные копией (${n} мес.)?`)) return;
    S = Object.assign(blank(), d);
    for (const m of Object.values(S.months)) { m.cats = m.cats || []; m.tx = m.tx || []; m.cats.forEach(c => c.subs = c.subs || []); }
    save();
    const ks = Object.keys(S.months).sort();
    if (!S.months[cur] && ks.length) cur = ks[ks.length - 1];
    tab = 'overview'; render(); toast('Данные восстановлены');
  } catch (e) { toast('Не удалось прочитать файл: ' + e.message); }
}

// ---------- toast ----------
let toastTimer;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2600); }

// ---------- actions ----------
const curMonth = () => S.months[cur];
const catOf = el => { const m = curMonth(), id = el.closest('[data-cid]')?.dataset.cid; return m && m.cats.find(c => c.id === id); };
const ACT = {
  tab: el => { tab = el.dataset.tab; if (tab !== 'tx') txFilter = 'all'; render(); scrollTo(0, 0); },
  prev: () => { cur = shiftMonth(cur, -1); txFilter = 'all'; render(); },
  next: () => { cur = shiftMonth(cur, 1); txFilter = 'all'; render(); },
  createMonth: () => { ensureMonth(cur); save(); render(); },
  starter: () => {
    S.months[cur] = {income: null, tx: [], cats: STARTER.map(([n, subs]) => ({id: uid(), name: n, limit: 0, subs: (subs || []).map(s => ({id: uid(), name: s, limit: 0}))}))};
    save(); tab = 'plan'; render();
  },
  blankStart: () => { S.months[cur] = {income: null, cats: [], tx: []}; save(); tab = 'plan'; render(); },
  hideInstall: () => { S.hideInstall = true; save(); render(); },
  restore: () => $('#fileBackup').click(),
  backup: () => doBackup(),
  editIncome: () => { tab = 'plan'; render(); scrollTo(0, 0); setTimeout(() => $('[data-f=income]')?.focus(), 50); },
  cat: el => openCat(el.dataset.id),
  goPlan: () => { closeSheet(); tab = 'plan'; render(); },
  showUn: () => { tab = 'tx'; txFilter = 'un'; render(); scrollTo(0, 0); },
  close: () => closeSheet(),
  addCat: () => {
    curMonth().cats.push({id: uid(), name: 'Новая категория', limit: 0, subs: []}); save(); render();
    const inputs = document.querySelectorAll('.pc-name'); const last = inputs[inputs.length - 1];
    if (last) { last.scrollIntoView({block: 'center'}); last.focus(); last.select(); }
  },
  addSub: el => {
    const c = catOf(el);
    c.subs.push({id: uid(), name: c.subs.length ? 'Новая' : c.name, limit: c.subs.length ? 0 : num(c.limit)}); c.limit = 0;
    save(); render();
    const row = document.querySelector(`[data-cid="${c.id}"] .srow:last-of-type input`); if (row) { row.focus(); row.select(); }
  },
  delSub: el => {
    const c = catOf(el), sid = el.closest('[data-sid]').dataset.sid;
    const s = c.subs.find(x => x.id === sid);
    c.subs = c.subs.filter(x => x.id !== sid);
    if (!c.subs.length) c.limit = num(s && s.limit);
    save(); render();
  },
  moveUp: el => move(el, -1), moveDown: el => move(el, 1),
  delCat: el => {
    const c = catOf(el);
    if (!confirm(`Удалить категорию «${c.name}» из плана на ${monthLabel(cur).toLowerCase()}?`)) return;
    curMonth().cats = curMonth().cats.filter(x => x.id !== c.id); save(); render();
  },
  copyPrev: () => {
    const prev = Object.keys(S.months).sort().filter(k => k < cur).pop();
    if (!prev || !confirm(`Заменить план на ${monthLabel(cur).toLowerCase()} копией плана за ${monthLabel(prev).toLowerCase()}?`)) return;
    curMonth().cats = JSON.parse(JSON.stringify(S.months[prev].cats)); curMonth().income = S.months[prev].income; save(); render();
  },
  import: () => openSheet(`<h2>Импорт из Qalta</h2>
    <ol class="steps"><li>В Qalta сделайте экспорт операций в CSV за месяц.</li><li>Нажмите «Выбрать файл» и найдите его в «Файлах» (или в «Загрузках»).</li></ol>
    <div class="btns"><button class="btn" data-act="pickCsv">Выбрать файл</button></div>
    <details><summary>Или вставить текст таблицы</summary><textarea id="pasteArea" rows="6" placeholder="Категория;Сумма;Дата"></textarea>
    <div class="btns"><button class="btn ghost" data-act="parsePaste">Разобрать</button></div></details>`),
  pickCsv: () => $('#fileCsv').click(),
  parsePaste: () => { const t = $('#pasteArea').value; if (t.trim()) startImport(t); },
  doImport: () => doImport(),
  addTx: () => openTx(null),
  tx: el => openTx(el.dataset.id),
  saveTx: el => {
    const id = el.dataset.id, inc = document.querySelector('input[name=kind]:checked').value === 'inc';
    const a = Math.abs(num($('#fAmt').value));
    if (!a) { toast('Введите сумму'); return; }
    const date = $('#fDate').value || null, target = date ? date.slice(0, 7) : cur;
    let t = {id: uid(), src: 'manual'};
    if (id) { const m = curMonth(); t = m.tx.find(x => x.id === id); m.tx = m.tx.filter(x => x.id !== id); }
    Object.assign(t, {date, cat: $('#fCat').value, sub: $('#fSub').value, amount: inc ? a : -a, note: $('#fNote').value.trim()});
    ensureMonth(target).tx.push(t); save(); closeSheet(); render();
    if (target !== cur) toast('Операция перенесена в ' + monthLabel(target).toLowerCase());
  },
  delTx: el => { const m = curMonth(); m.tx = m.tx.filter(x => x.id !== el.dataset.id); save(); closeSheet(); render(); },
  delAlias: el => { delete S.aliases[el.dataset.k]; save(); render(); },
  wipe: () => { if (!confirm('Удалить все данные на этом устройстве? Это нельзя отменить.')) return; S = blank(); save(); tab = 'overview'; render(); }
};
function move(el, d) {
  const cats = curMonth().cats, i = cats.indexOf(catOf(el)), j = i + d;
  if (j < 0 || j >= cats.length) return;
  [cats[i], cats[j]] = [cats[j], cats[i]]; save(); render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});

// typing in plan / settings: update state in place, without re-rendering (keeps focus on iPhone)
document.addEventListener('input', e => {
  const el = e.target, f = el.dataset.f; if (!f) return;
  if (f === 'currency') { S.currency = el.value.trim(); saveSoon(); return; }
  const m = curMonth(); if (!m) return;
  if (f === 'income') m.income = el.value.trim() === '' ? null : num(el.value);
  else {
    const c = catOf(el); if (!c) return;
    const s = el.closest('[data-sid]') && c.subs.find(x => x.id === el.closest('[data-sid]').dataset.sid);
    if (f === 'cname') c.name = el.value;
    else if (f === 'climit') c.limit = num(el.value);
    else if (f === 'sname') s.name = el.value;
    else if (f === 'slimit') s.limit = num(el.value);
    const tot = el.closest('[data-cid]').querySelector('[data-total]'); if (tot) tot.textContent = money(catLimit(c));
  }
  const ps = $('#plansum'); if (ps) ps.innerHTML = planSum(m);
  saveSoon();
});

document.addEventListener('change', e => {
  const el = e.target;
  // renaming a category keeps old transactions attached to it
  if (el.dataset.f === 'cname') {
    const old = norm(el.dataset.orig), nw = el.value.trim();
    if (!nw) { el.value = el.dataset.orig; catOf(el).name = el.dataset.orig; save(); return; }
    if (old && old !== norm(nw)) {
      for (const k in S.aliases) if (norm(S.aliases[k]) === old) S.aliases[k] = nw;
      S.aliases[old] = nw; delete S.aliases[norm(nw)];
    }
    catOf(el).name = nw; el.dataset.orig = nw; save();
  } else if (el.dataset.f === 'currency') { save(); }
  else if (el.id === 'fCat') { $('#fSub').innerHTML = subOpts(curMonth(), el.value, ''); }
  else if ('txfilter' in el.dataset) { txFilter = el.value; render(); }
  else if ('un' in el.dataset && el.value) {
    const k = el.dataset.un, m = curMonth();
    if (k) S.aliases[k] = el.value;
    else m.tx.forEach(t => { if (!norm(t.cat) && t.amount < 0) t.cat = el.value; });
    save(); render(); toast('Готово');
  }
  else if (el.dataset.imp) { imp.map[el.dataset.imp] = +el.value; renderImpSummary(); }
  else if (el.dataset.impflag) { imp[el.dataset.impflag] = el.checked; renderImpSummary(); }
  else if (el.name === 'impmode') imp.mode = el.value;
  else if ('imptarget' in el.dataset && el.value) { imp.target = el.value; renderImpSummary(); }
});

$('#fileCsv').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { startImport(await readText(f)); } catch (err) { toast('Не удалось прочитать файл: ' + err.message); }
});
$('#fileBackup').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) restoreFrom(f); });

render();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
